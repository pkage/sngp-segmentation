[project]
name = "sngp-segmentation"
version = "0.1.0"
description = ""
authors = [
    { name = "Patrick Kage", email = "p.kage@ed.ac.uk" },
    { name = "Jay Rothenberger", email = "jay.c.rothenberger@ou.edu" },
]
requires-python = ">=3.9,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "accelerate>=1.10.1",
    # "torch>=2.2.1,<3",
    # "torchvision>=0.17.1,<0.18",
    # "accelerate>=0.27.2,<0.28",
    # "rich>=13.7.1,<14",
    # "wandb>=0.16.4,<0.17",
    # "numpy>=1.26.4,<2",
    # "scipy>=1.12.0,<2",
    # "python-dotenv>=1.0.1,<2",
    # "torchmetrics>=1.3.1,<2",
    # "tqdm>=4.66.2,<5",
    # "h5py>=3.11.0,<4",
    # "einops>=0.7.0,<0.8",
    # "click>=8.1.7,<9",
    "arrow>=1.4.0",
    "click>=8.1.8",
    "dahps",
    "einops>=0.8.2",
    "h5py>=3.14.0",
    "numpy>=2.0.2",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.23.0",
    "tqdm>=4.67.2",
    "wandb>=0.24.1",
]

[dependency-groups]
dev = [
    # "ipykernel>=6.29.4,<7",
    # "matplotlib>=3.8.4,<4",
    # "ipywidgets>=8.1.2,<9",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["sngp_segmentation"]
module-root = ""

[tool.uv.workspace]
members = [
    "dahps",
]

[tool.uv.sources]
dahps = { workspace = true, editable = true }

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.jupyter.kernel]
name = "sngp-seg"
